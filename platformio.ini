; Standalone GY-BMI160 firmware for ESP32-S3.
[platformio]
default_envs = bmi160

[env:bmi160]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 460800
monitor_filters = default, log2file
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBMI160_MOSI_PIN=5
    -DBMI160_SCK_PIN=6
    -DBMI160_MISO_PIN=7
    -DBMI160_CS_PIN=15
